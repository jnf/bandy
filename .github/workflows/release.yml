name: release

on:
  pull_request:
  push:
    tags: ['v*']

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  ruby:
    # aarch64 runner, Trixie userland: the jukebox's arch, glibc, and sonames
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    container:
      image: debian@sha256:2dc419c6d7fe3dad0a2f9fd469c34cc90b0f9ba642d8fde837fe3d7d34a0e7f1 # trixie-20261027, multi-arch index
    outputs:
      artifact: ${{ steps.meta.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: meta
        run: |
          version=$(tr -d '[:space:]' < .ruby-version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "ruby-build=$(sed -n 's/^RUBY_BUILD_SHA=//p' release/build-ruby.sh)" >> "$GITHUB_OUTPUT"
          echo "artifact=ruby-$version-aarch64-linux.tar.gz" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dist/${{ steps.meta.outputs.artifact }}
          key: ruby-${{ steps.meta.outputs.version }}-aarch64-linux-rb${{ steps.meta.outputs.ruby-build }}-${{ hashFiles('.ruby-version', 'release/build-ruby.sh') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: bash release/build-ruby.sh dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.meta.outputs.artifact }}
          path: dist/${{ steps.meta.outputs.artifact }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0 # already gzipped

  ruby-probe:
    needs: ruby
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    container:
      image: debian@sha256:2dc419c6d7fe3dad0a2f9fd469c34cc90b0f9ba642d8fde837fe3d7d34a0e7f1 # trixie-20261027, multi-arch index
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Runtime libraries only
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
            libssl3t64 libyaml-0-2 zlib1g libffi8 libgmp10
      - name: No compiler
        run: |
          for tool in cc gcc c++ g++ clang make ld as; do
            if command -v "$tool"; then echo "compiler present: $tool"; exit 1; fi
          done
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.ruby.outputs.artifact }}
          path: artifact
      - name: Extract somewhere the build never was
        run: |
          mkdir -p /srv/relocated
          tar -xzf "artifact/${{ needs.ruby.outputs.artifact }}" -C /srv/relocated
          ls -l /srv/relocated/ruby
      - name: Runtime packages the build links against
        run: |
          { find /srv/relocated/ruby -type f \( -name '*.so*' -o -path '*/bin/ruby' \) -exec ldd {} + 2>/dev/null || true; } \
            | awk '$3 ~ /^\// { print $3 }' | xargs -r readlink -f | sort -u | grep -v '^/srv/relocated/' \
            | xargs -r dpkg -S | cut -d: -f1 | sort -u
      - run: bash release/probe-ruby.sh /srv/relocated/ruby

  package:
    needs: ruby
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    container:
      image: debian@sha256:2dc419c6d7fe3dad0a2f9fd469c34cc90b0f9ba642d8fde837fe3d7d34a0e7f1 # trixie-20261027, multi-arch index
    outputs:
      asset: ${{ steps.meta.outputs.asset }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: meta
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "asset=bandy-${TAG:-${GITHUB_SHA:0:12}}-aarch64-linux.tar.gz" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.ruby.outputs.artifact }}
          path: artifact
      - env:
          RUBY_TARBALL: artifact/${{ needs.ruby.outputs.artifact }}
          TAG: ${{ steps.meta.outputs.tag }}
          ASSET: ${{ steps.meta.outputs.asset }}
        run: |
          bash release/package.sh "$RUBY_TARBALL" dist "$TAG"
          test -f "dist/$ASSET" && test -f "dist/$ASSET.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.meta.outputs.asset }}
          path: |
            dist/${{ steps.meta.outputs.asset }}
            dist/${{ steps.meta.outputs.asset }}.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0 # already gzipped

  package-test:
    # What the jukebox has: runtime libraries, no compiler. The release has to
    # pass bandy's suite from wherever it's extracted, with nothing to build.
    needs: package
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    container:
      image: debian@sha256:2dc419c6d7fe3dad0a2f9fd469c34cc90b0f9ba642d8fde837fe3d7d34a0e7f1 # trixie-20261027, multi-arch index
    env:
      ASSET: ${{ needs.package.outputs.asset }}
      DIR: /srv/elsewhere/bandy
    steps:
      - name: Runtime libraries only
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
            libssl3t64 libyaml-0-2 zlib1g libffi8 libgmp10
      - name: No compiler
        run: |
          for tool in cc gcc c++ g++ clang make ld as; do
            if command -v "$tool"; then echo "compiler present: $tool"; exit 1; fi
          done
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.package.outputs.asset }}
          path: artifact
      - name: Check the sha256 and extract somewhere the build never was
        run: |
          (cd artifact && sha256sum -c "$ASSET.sha256")
          mkdir -p "$DIR"
          tar -xzf "artifact/$ASSET" -C "$DIR"
          ls -la "$DIR"
          cat "$DIR/REVISION"
      - name: Suite, from the release, with the release's Ruby
        working-directory: ${{ env.DIR }}
        run: |
          unset RUBYOPT RUBYLIB GEM_HOME GEM_PATH BUNDLE_GEMFILE BUNDLE_PATH BUNDLE_APP_CONFIG
          export PATH="$PWD/ruby/bin:$PATH"
          mkdir -p logs
          set +e
          ruby/bin/ruby -S bundle exec ruby test/run.rb 2>&1 | tee "$RUNNER_TEMP/suite.out"
          status=${PIPESTATUS[0]}
          set -e
          # A bare non-zero exit with no summary is a crash, not a red suite.
          summary=$(grep -E '^[0-9]+ runs, [0-9]+ assertions, [0-9]+ failures, [0-9]+ errors' "$RUNNER_TEMP/suite.out" || true)
          if [ -z "$summary" ]; then echo "suite crashed (exit $status): no minitest summary"; exit 1; fi
          echo "summary: $summary (exit $status)"
          echo "suite: \`$summary\`" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Every gem compiled in the package job ships its extension, and it loads
        # The suite never requires some of them (minitest only loads prism for its
        # CLI), so it can't notice one missing.
        if: ${{ !cancelled() }}
        working-directory: ${{ env.DIR }}
        run: |
          unset RUBYOPT RUBYLIB GEM_HOME GEM_PATH BUNDLE_GEMFILE BUNDLE_PATH BUNDLE_APP_CONFIG
          export PATH="$PWD/ruby/bin:$PATH"
          ruby/bin/ruby -S bundle exec ruby -e '
            built = Bundler.load.specs.select { File.exist?(File.join(_1.extension_dir, "gem.build_complete")) }
            abort "no compiled gems found under #{Dir.pwd}" if built.empty?
            built.each do |spec|
              sos = Dir.glob("**/*.so", base: spec.extension_dir).sort
              abort "#{spec.full_name}: built, but no .so in #{spec.extension_dir}" if sos.empty?
              # Through the gem entry point: an extension can lean on its Ruby half.
              require spec.name
              sos.each do |so|
                require so.delete_suffix(".so")
                $LOADED_FEATURES.any? { _1.end_with?("/#{so}") } or abort "#{spec.full_name}: #{so} never loaded"
              end
              puts "#{spec.full_name}: #{sos.join(", ")} loaded"
            end
          '
      - name: bandy.rb loads its full require graph, without running the pipeline
        if: ${{ !cancelled() }} # report it even when the suite went red
        working-directory: ${{ env.DIR }}
        run: |
          unset RUBYOPT RUBYLIB GEM_HOME GEM_PATH BUNDLE_GEMFILE BUNDLE_PATH BUNDLE_APP_CONFIG
          # Everything in bandy.rb before the first pipeline stage runs: its own
          # bundler/setup, then the gems, the api classes, and every script.
          ruby/bin/ruby -e '
            dir = Dir.pwd
            src = File.read("bandy.rb", encoding: "UTF-8") # no locale in the container
            cut = src.index(/^SyncCollection\.new\.run/) or abort "bandy.rb: no pipeline start to stop at"
            eval(src[0...cut], TOPLEVEL_BINDING, File.join(dir, "bandy.rb"), 1)
            %w[SyncCollection EnrichItems QueueItems DownloadItems UnpackItems
               HTTParty Nokogiri Zip Dotenv PStore].each { Object.const_get(_1) }
            stray = $LOADED_FEATURES.select { _1.start_with?("/") && !_1.start_with?(dir + "/") }
            abort "loaded from outside the release:\n#{stray.join("\n")}" unless stray.empty?
            puts "bandy.rb require graph: #{$LOADED_FEATURES.size} features, all under #{dir}"
          '

  release:
    # Tag pushes only, and the only job that can write to the repo.
    if: github.ref_type == 'tag'
    needs: [package, package-test]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      ASSET: ${{ needs.package.outputs.asset }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.package.outputs.asset }}
          path: artifact
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd artifact && sha256sum -c "$ASSET.sha256")
          # rc tags are public prereleases: downloadable without a login, unlike drafts.
          kind=()
          case "$TAG" in *-rc.*) kind=(--prerelease) ;; esac
          gh release create "$TAG" "artifact/$ASSET" "artifact/$ASSET.sha256" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" "${kind[@]}" \
            --notes "Ruby, gems, and bandy at $GITHUB_SHA, built for aarch64 Debian 13. Check with: sha256sum -c $ASSET.sha256"

  deploy-test:
    # deploy.sh against a real public release, in what the jukebox has: runtime
    # libraries, curl, no compiler, and a throwaway HOME with bandy's state in it.
    # Then doctored copies of that release, served from file://, for the refusals.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    container:
      image: debian@sha256:2dc419c6d7fe3dad0a2f9fd469c34cc90b0f9ba642d8fde837fe3d7d34a0e7f1 # trixie-20261027, multi-arch index
    env:
      # A published release (rc tags are deleted after their run: repoint this at a live tag).
      TAG: v0.0.0-rc.2
      HOME: /srv/home/jey
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Runtime libraries and curl only
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
            libssl3t64 libyaml-0-2 zlib1g libffi8 libgmp10 curl ca-certificates
      - name: No compiler
        run: |
          for tool in cc gcc c++ g++ clang make ld as; do
            if command -v "$tool"; then echo "compiler present: $tool"; exit 1; fi
          done
      - name: A jukebox-shaped HOME, and the checks every step shares
        run: |
          [ "$HOME" = /srv/home/jey ] || { echo "HOME is $HOME"; exit 1; }
          mkdir -p "$HOME/bandy"/{store,logs,downloads,collection/Artist/Album} "$HOME/tmp"
          cd "$HOME/bandy"
          echo "IDENT='not-a-real-cookie'" > .env
          head -c 4096 /dev/urandom > store/collection_items.pstore
          echo "an old cron run" > logs/cron.log
          echo "not really audio" > collection/Artist/Album/01.mp3
          # The rsync era left a Gemfile here; the release must not pick it up.
          printf 'source "https://rubygems.org"\ngem "decoy-stale-rsync-era-gemfile"\n' > Gemfile
          find .env Gemfile store logs downloads collection -type f -exec sha256sum {} + | sort > "$RUNNER_TEMP/state.before"
          cat > "$RUNNER_TEMP/checks.sh" <<'SH'
          set -euo pipefail
          DEPLOY="$GITHUB_WORKSPACE/release/deploy.sh"
          # RUNNER_TEMP is the container path; the runner.temp expression is the host one.
          FIXTURES="file://$RUNNER_TEMP/fixtures"
          cd "$HOME/bandy"
          target() { readlink "$HOME/bandy/current" || echo "(none)"; }
          fail() { echo "FAIL: $*"; exit 1; }
          # deploy.sh left nothing behind: no work dir in ~/tmp, no staging, no temp link.
          clean() {
            [ -z "$(ls -A "$HOME/tmp")" ] || fail "left in ~/tmp: $(ls -A "$HOME/tmp")"
            ! ls -d "$HOME/bandy"/releases/.staging-* "$HOME/bandy"/releases/.replaced-* "$HOME/bandy"/.current.new.* 2>/dev/null \
              || fail "staging or temp link left behind"
          }
          expect_current() {
            [ "$(target)" = "releases/$1" ] || fail "current -> $(target), want releases/$1"
            grep -qx "tag=$1" current/REVISION || fail "current/REVISION doesn't name $1: $(cat current/REVISION)"
          }
          # deploy.sh <args> has to exit non-zero, say <pattern>, and leave current alone.
          expect_refusal() {
            local pattern=$1 before status; shift
            before=$(target)
            set +e; bash "$DEPLOY" "$@" > "$RUNNER_TEMP/out" 2>&1; status=$?; set -e
            cat "$RUNNER_TEMP/out"
            [ "$status" -ne 0 ] || fail "deploy.sh $* exited 0"
            grep -q -- "$pattern" "$RUNNER_TEMP/out" || fail "deploy.sh $* didn't say: $pattern"
            [ "$(target)" = "$before" ] || fail "current moved: $before -> $(target)"
            clean
          }
          SH
      - name: Deploy the real release
        run: |
          . "$RUNNER_TEMP/checks.sh"
          bash "$DEPLOY" "$TAG"
          expect_current "$TAG"
          clean
          [ "$(ls releases)" = "$TAG" ] || fail "releases: $(ls releases)"
      - name: The cron line runs bandy from current, not the stale ~/bandy/Gemfile
        run: |
          . "$RUNNER_TEMP/checks.sh"
          unset RUBYOPT RUBYLIB GEM_HOME GEM_PATH BUNDLE_GEMFILE BUNDLE_PATH BUNDLE_APP_CONFIG
          # The cron line, up to where bandy.rb starts the pipeline (no Bandcamp).
          current/ruby/bin/ruby -e '
            path = File.expand_path("current/bandy.rb")
            src = File.read(path, encoding: "UTF-8")
            cut = src.index(/^SyncCollection\.new\.run/) or abort "bandy.rb: no pipeline start to stop at"
            eval(src[0...cut], TOPLEVEL_BINDING, path, 1)
            %w[SyncCollection EnrichItems QueueItems DownloadItems UnpackItems HTTParty Nokogiri Zip Dotenv].each { Object.const_get(_1) }
            homes = [File.expand_path("current"), File.realpath("current")].map { _1 + "/" }
            puts "Gemfile: #{Bundler.default_gemfile}"
            homes.any? { Bundler.default_gemfile.to_s.start_with?(_1) } or abort "bundler used #{Bundler.default_gemfile}"
            stray = $LOADED_FEATURES.select { |f| f.start_with?("/") && homes.none? { f.start_with?(_1) } }
            abort "loaded from outside the release:\n#{stray.join("\n")}" unless stray.empty?
            puts "cron line: #{$LOADED_FEATURES.size} features, all from current"
          '
      - name: Redeploying the current tag does nothing
        run: |
          . "$RUNNER_TEMP/checks.sh"
          bash "$DEPLOY" "$TAG" | tee "$RUNNER_TEMP/out"
          grep -q "already current" "$RUNNER_TEMP/out" || fail "no 'already current'"
          expect_current "$TAG"
          clean
      - name: Doctored copies of the release, served from file://
        run: |
          . "$RUNNER_TEMP/checks.sh"
          fx="$RUNNER_TEMP/fixtures"
          mkdir -p "$fx/real"
          curl -q --fail --location --silent --show-error -o "$fx/real.tar.gz" \
            "https://github.com/jnf/bandy/releases/download/$TAG/bandy-$TAG-aarch64-linux.tar.gz"
          tar -xzf "$fx/real.tar.gz" -C "$fx/real"
          # tree <name>: a copy of the release whose REVISION names <name>
          tree() { cp -a "$fx/real" "$fx/tree-$1"; sed -i "s/^tag=.*/tag=$1/" "$fx/tree-$1/REVISION"; }
          # publish <name>: tarball and .sha256 at <base>/<name>/, as GitHub lays them out
          publish() {
            local a="bandy-$1-aarch64-linux.tar.gz"
            mkdir -p "$fx/$1"
            tar -C "$fx/tree-$1" --owner=0 --group=0 --numeric-owner -czf "$fx/$1/$a" .
            (cd "$fx/$1" && sha256sum "$a" > "$a.sha256")
          }
          for good in v0.0.0-test.a v0.0.0-test.b; do tree "$good"; publish "$good"; done

          # One byte changed after hashing: the .sha256 is for the unchanged tarball.
          bad=v0.0.0-test.badbyte
          tree "$bad"; publish "$bad"
          cp "$fx/$bad/bandy-$bad-aarch64-linux.tar.gz.sha256" "$fx/sha.keep"
          grep -q '^# dependencies$' "$fx/tree-$bad/bandy.rb"
          sed -i 's/^# dependencies$/# dependencieZ/' "$fx/tree-$bad/bandy.rb"
          publish "$bad"
          cp "$fx/sha.keep" "$fx/$bad/bandy-$bad-aarch64-linux.tar.gz.sha256"
          ! (cd "$fx/$bad" && sha256sum -c --quiet "bandy-$bad-aarch64-linux.tar.gz.sha256") || fail "badbyte fixture still matches"

          # A release with one test made to fail, correctly hashed.
          red=v0.0.0-test.redsuite
          tree "$red"
          printf '%s\n' "require 'minitest/autorun'" \
            'class TestDeliberatelyRed < Minitest::Test' \
            '  def test_deliberately_red = flunk("deliberately red: deploy-test suite control")' \
            'end' > "$fx/tree-$red/test/test_zz_deliberately_red.rb"
          publish "$red"
          rm -rf "$fx"/tree-* "$fx/real" "$fx/real.tar.gz"
          ls -R "$fx"
      - name: "Control: a tarball with one byte changed fails the sha256 check, current stays"
        run: |
          . "$RUNNER_TEMP/checks.sh"
          export BANDY_DEPLOY_BASE_URL="$FIXTURES"
          expect_refusal "FAILED at step: 2 sha256" v0.0.0-test.badbyte
          grep -q "sha256 mismatch" "$RUNNER_TEMP/out" || fail "no sha256 mismatch"
          [ ! -e releases/v0.0.0-test.badbyte ] || fail "badbyte release installed"
          expect_current "$TAG"
      - name: "Control: a release whose suite fails leaves current alone"
        run: |
          . "$RUNNER_TEMP/checks.sh"
          export BANDY_DEPLOY_BASE_URL="$FIXTURES"
          expect_refusal "FAILED at step: 4 suite" v0.0.0-test.redsuite
          grep -q "deliberately red" "$RUNNER_TEMP/out" || fail "the red test didn't run"
          [ ! -e releases/v0.0.0-test.redsuite ] || fail "red release installed"
          expect_current "$TAG"
      - name: A second deploy, then a rollback flips current back
        run: |
          . "$RUNNER_TEMP/checks.sh"
          export BANDY_DEPLOY_BASE_URL="$FIXTURES"
          bash "$DEPLOY" v0.0.0-test.a
          expect_current v0.0.0-test.a
          clean
          bash "$DEPLOY" --rollback | tee "$RUNNER_TEMP/out"
          grep -qE ' 0 failures, 0 errors' "$RUNNER_TEMP/out" || fail "no passing suite in the rollback"
          expect_current "$TAG"
          clean
          [ "$(ls releases | xargs)" = "$TAG v0.0.0-test.a" ] || fail "releases: $(ls releases | xargs)"
      - name: deploy.sh refuses while bandy runs, and only bandy counts
        run: |
          . "$RUNNER_TEMP/checks.sh"
          export BANDY_DEPLOY_BASE_URL="$FIXTURES"
          # bandy as cron starts it: ruby, with current/bandy.rb in its argv.
          current/ruby/bin/ruby -e 'sleep 120' current/bandy.rb &
          bandy=$!
          sleep 2
          expect_refusal "bandy is running (PID $bandy)" v0.0.0-test.b
          expect_refusal "bandy is running (PID $bandy)" --rollback
          kill "$bandy"
          wait "$bandy" || true
          # Not ruby, so not bandy, even with bandy.rb in its argv.
          bash -c 'sleep 120; :' /srv/elsewhere/bandy.rb &
          other=$!
          sleep 1
          bash "$DEPLOY" --rollback
          expect_current v0.0.0-test.a
          clean
          kill "$other"
          wait "$other" || true
      - name: Pruning keeps two, current and the one before
        run: |
          . "$RUNNER_TEMP/checks.sh"
          export BANDY_DEPLOY_BASE_URL="$FIXTURES"
          bash "$DEPLOY" v0.0.0-test.b
          expect_current v0.0.0-test.b
          clean
          [ "$(ls releases | xargs)" = "v0.0.0-test.a v0.0.0-test.b" ] || fail "releases: $(ls releases | xargs)"
      - name: bandy's state is untouched
        run: |
          . "$RUNNER_TEMP/checks.sh"
          find .env Gemfile store logs downloads collection -type f -exec sha256sum {} + | sort > "$RUNNER_TEMP/state.after"
          diff "$RUNNER_TEMP/state.before" "$RUNNER_TEMP/state.after" || fail "state changed"
          ls -A "$HOME/bandy" "$HOME/bandy/releases"
