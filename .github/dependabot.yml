version: 2
updates:
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: weekly
    # Let new releases age a week before proposing them; security updates skip the wait.
    cooldown:
      default-days: 7
    # One PR per week for routine bumps, not one per gem.
    groups:
      gems:
        patterns: ["*"]

  # Actions are pinned by SHA; Dependabot keeps the SHA and its version comment in step.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
